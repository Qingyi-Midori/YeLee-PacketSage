[[bin]]
name = "fuzz_decoder"
path = "fuzz_targets/fuzz_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_config_yaml"
path = "fuzz_targets/fuzz_config_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_rules_yaml"
path = "fuzz_targets/fuzz_rules_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_rpc_jsonl"
path = "fuzz_targets/fuzz_rpc_jsonl.rs"
