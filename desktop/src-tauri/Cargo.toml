[package]
name = "packetsage-desktop"
version = "4.1.5"
description = "PacketSage desktop shell: two sidecars (engine + agent) behind one native window"
authors = ["YeLee' PacketSage"]
edition = "2021"
rust-version = "1.80"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows).
name = "packetsage_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# U7：api key 存 Windows 凭据管理器（§7.4 第 3 步，不落明文）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace]
# The shell is its own workspace on purpose: the engine workspace pins the GNU
# toolchain (rust-toolchain.toml at the repo root) while the Tauri stack needs
# MSVC (§7.7). Keeping them apart also keeps the two target/ dirs apart.
members = []
