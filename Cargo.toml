[workspace]
resolver = "2"
members = [
    "crates/packetsage-protocol",
    "crates/packetsage-core",
    "crates/packetsage-rules",
    "crates/packetsage-storage",
    "crates/packetsage-cli",
    "crates/packetsage-fuzz",
]

[workspace.package]
version = "3.8.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Qingyi-Midori/YeLee-PacketSage"
rust-version = "1.80"

[workspace.dependencies]
packetsage-protocol = { path = "crates/packetsage-protocol" }
packetsage-core = { path = "crates/packetsage-core" }
packetsage-rules = { path = "crates/packetsage-rules" }
packetsage-storage = { path = "crates/packetsage-storage" }

pcap-parser = "0.17"
etherparse = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
bytes = "1"
ulid = "1"
humantime-serde = "1"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "warn"
integer_division = "warn"

[profile.release]
lto = "thin"
debug = true
